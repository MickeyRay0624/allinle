<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ALLINLE</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(560px, calc(100% - 40px)); padding: 48px 32px; border: 1px solid #263349; border-radius: 20px; background: #111c2f; text-align: center; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
      h1 { margin: 0 0 12px; font-size: 42px; letter-spacing: .08em; }
      p { margin: 0; color: #a9b8ce; line-height: 1.8; }
      .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; padding: 8px 14px; border-radius: 999px; background: #132d25; color: #75e0b3; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #42d392; }
    </style>
  </head>
  <body>
    <main>
      <h1>ALLINLE</h1>
      <p>德州扑克学习、练习与线下牌局记账平台</p>
      <div class="status"><span class="dot"></span>服务运行正常</div>
    </main>
  </body>
</html>
