# ALLINLE Nginx Configuration
# Place at: /etc/nginx/sites-available/allinle
# Enable: ln -s /etc/nginx/sites-available/allinle /etc/nginx/sites-enabled/

upstream allinle_api {
    server 127.0.0.1:3000;
}

upstream allinle_admin {
    server 127.0.0.1:3001;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name api.allinle.example.com admin.allinle.example.com;
    return 301 https://$host$request_uri;
}

# API server
server {
    listen 443 ssl http2;
    server_name api.allinle.example.com;

    ssl_certificate /etc/letsencrypt/live/api.allinle.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.allinle.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://allinle_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket upgrade
    location /practice-room {
        proxy_pass http://allinle_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/allinle-api-access.log;
    error_log /var/log/nginx/allinle-api-error.log;
}

# Admin panel
server {
    listen 443 ssl http2;
    server_name admin.allinle.example.com;

    ssl_certificate /etc/letsencrypt/live/admin.allinle.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.allinle.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/allinle/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://allinle_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/allinle-admin-access.log;
    error_log /var/log/nginx/allinle-admin-error.log;
}
