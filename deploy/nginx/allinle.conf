# ALLINLE Nginx HTTP template
#
# Before enabling this file, replace:
#   api.example.com   -> the public API domain
#   admin.example.com -> the admin panel domain
#   /opt/allinle      -> the absolute project directory
#
# Certbot can add the HTTPS listeners and redirect after this HTTP
# configuration passes `nginx -t`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream allinle_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://allinle_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/allinle-api-access.log;
    error_log /var/log/nginx/allinle-api-error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    root /opt/allinle/apps/admin/dist;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://allinle_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://allinle_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/allinle-admin-access.log;
    error_log /var/log/nginx/allinle-admin-error.log;
}
