server {
    listen 443 ssl http2;
    server_name lmqstudio.com www.lmqstudio.com;
    root /var/www/lmqstudio/www;
    index index.html;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/lmqstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lmqstudio.com/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name lmqstudio.com www.lmqstudio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name poker.lmqstudio.com api.lmqstudio.com admin.lmqstudio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name poker.lmqstudio.com;
    root /opt/lmqstudio/poker;
    index index.html;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/lmqstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lmqstudio.com/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl http2;
    server_name api.lmqstudio.com;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/lmqstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lmqstudio.com/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.lmqstudio.com;
    root /opt/lmqstudio/admin;
    index index.html;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/lmqstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lmqstudio.com/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { try_files $uri $uri/ /index.html; }
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
